[project]
name = "library"
version = "0.1.0"
description = "API de cadastro e consulta de livros (Questão 1)"
readme = "README.md"
authors = [
    { name = "Miguel Minotti", email = "miguelminotti.mm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
library = "library.api.main:run"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: testes não precisam de __init__.py e importam o pacote instalado, não o diretório atual
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
