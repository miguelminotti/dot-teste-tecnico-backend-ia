[project]
name = "semantic-search"
version = "0.1.0"
description = "Busca semântica de documentos com embeddings e vector store (Questão 3)"
readme = "README.md"
authors = [
    { name = "Miguel Minotti", email = "miguelminotti.mm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
semantic-search = "semantic_search:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.3",
]
