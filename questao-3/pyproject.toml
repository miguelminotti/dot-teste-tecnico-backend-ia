[project]
name = "semantic-search"
version = "0.1.0"
description = "Busca semântica de documentos com embeddings e vector store (Questão 3)"
readme = "README.md"
authors = [
    { name = "Miguel Minotti", email = "miguelminotti.mm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "bm25s[stem]>=0.3.16",
    "faiss-cpu>=1.15.1",
    "openai>=3.40.0",
    "pydantic>=2.14.1",
    "sentence-transformers>=5",
]

[project.scripts]
semantic-search = "semantic_search.search:main"
semantic-search-corpus = "semantic_search.corpus:main"
semantic-search-queries = "semantic_search.evaluation.queries:main"
semantic-search-embed = "semantic_search.embeddings:main"
semantic-search-store = "semantic_search.vector_store:main"
semantic-search-eval = "semantic_search.evaluation.retrieval:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: testes não precisam de __init__.py e importam o pacote instalado, não o diretório atual
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[[tool.mypy.overrides]]
# O bm25s e o PyStemmer não publicam tipos.
module = ["bm25s", "bm25s.*", "Stemmer"]
ignore_missing_imports = true
